<script>
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-tabgroup="nf"]');
  if (!b) return;
  document.querySelectorAll('[data-tabgroup="nf"]').forEach(function(x){x.classList.remove('is-active');});
  b.classList.add('is-active');
  var key = b.getAttribute('data-tabkey');
  document.querySelectorAll('#notif-list > [data-item]').forEach(function(li){
    li.style.display = (key === 'all' || li.getAttribute('data-group') === key) ? '' : 'none';
  });
});
</script>
